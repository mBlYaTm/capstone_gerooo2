services:

  # ── Redis — Zero-Persistence (no disk save) ──────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: zero-redis
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── FastAPI Server ────────────────────────────────────────────────────────
  api:
    build: .
    container_name: zero-api
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - .:/app
    working_dir: /app
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  # ── Redis Exporter — Redis-ийн мэдээллийг Prometheus-д өгнө ──────────────
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: zero-redis-exporter
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
      # token:* болон used_jti:* key-үүдийн тоог тусад нь тоолно
      - REDIS_EXPORTER_COUNT_KEYS=db0=token:*,db0=used_jti:*
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Prometheus — 5 секунд бүр exporter-оос өгөгдөл цуглуулна ─────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: zero-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - redis-exporter
    restart: unless-stopped

  # ── Grafana Dashboard — Prometheus-ээс уншина ─────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: zero-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
